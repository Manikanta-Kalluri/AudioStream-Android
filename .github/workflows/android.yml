
name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Sender
        run: |
          cd sender
          gradle assembleDebug

      - name: Build Receiver
        run: |
          cd receiver
          gradle assembleDebug
```
