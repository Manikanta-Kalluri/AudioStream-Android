name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Sender
        run: |
          cd sender
          gradle assembleDebug

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-apk
          path: sender/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Receiver
        run: |
          cd receiver
          gradle assembleDebug

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-apk
          path: receiver/app/build/outputs/apk/debug/app-debug.apk
