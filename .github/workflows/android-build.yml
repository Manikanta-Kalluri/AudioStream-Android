name: Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  sender:
    name: Build Sender
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Sender
        working-directory: sender
        run: gradle assembleDebug

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-apk
          path: sender/app/build/outputs/apk/debug/app-debug.apk


  receiver:
    name: Build Receiver
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Receiver
        working-directory: receiver
        run: gradle assembleDebug

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-apk
          path: receiver/app/build/outputs/apk/debug/app-debug.apk
```
